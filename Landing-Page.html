<!DOCTYPE html>
<html lang="en">
<head>

                <li><a href="#">Action-Figures</a></li>

            </ul>
            <ul>
                <li><a href="#">Nerd&Proud</a></li>

                <li class="hideOnMobile"><a href="#">Statues</a></li>
                <li class="hideOnMobile"><a href="#">Clearance-Sale</a></li>

    <script>
        function showSidebar() {
            const sidebar =  document.querySelector('.sidebar');
            sidebar.style.display = 'flex';
        }
        function hideSidebar(){
            const sidebar =  document.querySelector('.sidebar');
            sidebar.style.display = 'none';
        }
    </script>
</body>
</html>
